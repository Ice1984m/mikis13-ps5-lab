name: Build PC Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zip
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          mkdir dist
          cp build/mikis13-ps5 README.md dist/
          zip -r mikis13-ps5-linux-x86_64.zip dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: mikis13-ps5-linux-x86_64.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item build/Release/mikis13-ps5.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath mikis13-ps5-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: mikis13-ps5-windows-x64.zip
