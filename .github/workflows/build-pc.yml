name: Build PS5 Lab PC Downloads

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  linux:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build

      - name: Build
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build

          mkdir -p dist

          cp \
            build/mikis13-ps5 \
            dist/

          cp \
            README.md \
            dist/

          cd dist

          zip \
            ../mikis13-ps5-lab-v3-linux-x86_64.zip \
            *

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: mikis13-ps5-lab-v3-linux-x86_64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: mikis13-ps5-lab-v3-linux-x86_64.zip


  windows:

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -A x64

      - name: Build
        run: |
          cmake \
            --build build \
            --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            dist

          Copy-Item `
            build/Release/mikis13-ps5.exe `
            dist/

          Copy-Item `
            README.md `
            dist/

          Compress-Archive `
            -Path dist/* `
            -DestinationPath mikis13-ps5-lab-v3-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: mikis13-ps5-lab-v3-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: mikis13-ps5-lab-v3-windows-x64.zip
