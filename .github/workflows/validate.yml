name: Validate PS5 Lab V3

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:

  linux:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            jq

      - name: Tests
        run: |
          chmod +x scripts/*.sh

          ./scripts/test.sh
